[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-*
monitor_port = /dev/cu.usbserial-*
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I src
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DST7735_REDTAB
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=17
    -DTFT_RST=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=27000000

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<core/>
build_flags = -std=c++17 -I src -Wall

; Desktop simulator: firmware logic + mock input in virtual time.
; pio run -e sim && .pio/build/sim/program "1@500" 90000 > timeline.csv
[env:sim]
platform = native
build_src_filter = +<core/> +<sim/> +<platform/mock_input.cpp>
build_flags = -std=c++17 -I src -Wall
